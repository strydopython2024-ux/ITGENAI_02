{% extends 'base.html' %}{% block content %}<div class="max-w-3xl mx-auto"><div class="card"><h2 class="text-2xl font-bold">Upload a CSV Dataset</h2><p class="text-slate-500 mt-2">The uploaded file becomes the active dataset and replaces the previous one.</p><form method="post" enctype="multipart/form-data" class="mt-8" id="upload-form"><label class="upload-box"><input type="file" name="file" accept=".csv,text/csv" required class="hidden" id="file-input"><div class="text-lg font-semibold">Choose CSV file</div><div class="text-sm text-slate-500 mt-2" id="file-name">CSV files up to 25 MB</div></label><button class="btn-primary mt-6 w-full">Upload and Analyze</button></form></div></div>{% endblock %}
